<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avad</title>
<meta name="description" content="A wall for whatever you want to look at: links, images, video, notes, files, code, data.">
<meta name="theme-color" content="#ECE5D4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171510" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231D1B16'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%23C93A1B'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/young-serif-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/styles.css">
<script>
  // Theme and input type before first paint so nothing flashes.
  try {
    const t = localStorage.getItem("avad:theme");
    if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  } catch {}
  document.documentElement.dataset.input = matchMedia("(pointer: coarse)").matches ? "touch" : "mouse";
</script>
<script type="module" src="/js/app.js"></script>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="mark" href="/" aria-label="Avad home">Avad<i aria-hidden="true"></i></a>
    <nav class="boards" aria-label="Boards">
      <h2 class="label">Boards</h2>
      <ol id="boards"></ol>
      <button class="link" id="newBoard" type="button">+ New board</button>
    </nav>
    <div class="tools" role="group" aria-label="Tools">
      <button class="link" id="share" type="button">Share</button>
      <button class="link" id="export" type="button">Save backup</button>
      <button class="link" id="import" type="button">Restore backup</button>
      <button class="link" id="reset" type="button">Reset</button>
      <button class="link" id="theme" type="button">Theme</button>
    </div>
  </aside>

  <main class="main">
    <div id="shared" class="shared" hidden>
      <span>Shared with you.</span>
      <button class="solid" id="keep" type="button">Keep a copy</button>
    </div>

    <header class="top">
      <h1 id="boardTitle">Board</h1>
      <div class="top-meta">
        <span id="count" class="mono"></span>
        <button class="outline" id="renameBoard" type="button">Rename</button>
        <button class="outline" id="deleteBoard" type="button">Delete</button>
        <button class="outline" id="present" type="button">Slideshow</button>
      </div>
    </header>

    <form id="bar" class="bar" autocomplete="off">
      <span id="chip" class="chip mono" aria-live="polite">add</span>
      <textarea id="input" rows="1" enterkeyhint="send" aria-label="Add anything"
        placeholder="Paste a link or type a note"></textarea>
      <label class="outline pickbtn" for="photos">Photos</label>
      <label class="outline pickbtn" for="file">Files</label>
      <button type="submit" class="solid">Add</button>
    </form>

    <div id="filters" class="filters" role="group" aria-label="Filter by type"></div>
    <div id="wall" class="wall"></div>
    <p id="empty" class="empty" hidden>Nothing here yet. Tap <b>Photos</b> to add pictures, <b>Files</b> for anything else, or paste a link above.</p>
  </main>
</div>

<div id="stage" class="stage" hidden role="dialog" aria-modal="true" aria-label="Stage">
  <div class="stage-top">
    <span id="stageNo" class="mono"></span>
    <span id="stageTitle" class="stage-title"></span>
    <button class="stage-btn" id="stagePlay" type="button" aria-pressed="false">Auto-play</button>
    <button class="stage-btn" id="stageClose" type="button" aria-label="Close stage">Close</button>
  </div>
  <div id="stageBody" class="stage-body"></div>
  <div class="stage-bottom">
    <button class="stage-btn" id="stagePrev" type="button" aria-label="Previous">&larr;</button>
    <p id="stageCap" class="stage-cap"></p>
    <button class="stage-btn" id="stageNext" type="button" aria-label="Next">&rarr;</button>
  </div>
</div>

<dialog id="dlg" class="dlg">
  <form method="dialog" id="dlgForm"></form>
</dialog>

<input id="photos" class="vh" type="file" accept="image/*,video/*" multiple>
<input id="file" class="vh" type="file" multiple>
<input id="importFile" class="vh" type="file" accept="application/json,.json">
<div id="drop" class="drop" hidden aria-hidden="true"><span>Drop</span></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
